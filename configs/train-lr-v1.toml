# Logistic regression on feature version f1, sim-v2. All choices are made on validation data;
# the final test period (day >= 153) is never loaded by `fraudplat.training.train`.
dataset_dir = "data/raw/sim-v2"
derived_root = "data/derived"
artifacts_root = "artifacts"
reports_root = "reports/training"

burn_in_days = 30
train_end_day = 100
training_cutoff_day = 130
test_start_day = 153

seed = 0
# Grid chosen after a development run selected C = 0.001 at the lower edge of [0.001, 10].
class_weights = ["balanced", "none"]
c_grid = [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]

# Operational assumptions (not measured): analysts can review about 1% of transactions;
# automatic decline only where validation precision is at least 90% on at least 50 rows.
review_budget = 0.01
decline_min_precision = 0.90
decline_min_count = 50

nullable = ["cust_amount_mean_7d", "cust_amount_mean_30d", "amount_to_cust_mean_30d",
            "secs_since_prev_cust_txn"]
log1p = ["amount_minor", "cust_txn_count_1h", "cust_txn_count_1d", "cust_txn_count_7d",
         "cust_txn_count_30d", "cust_amount_mean_7d", "cust_amount_mean_30d",
         "amount_to_cust_mean_30d", "secs_since_prev_cust_txn", "term_txn_count_1d",
         "term_txn_count_7d"]
